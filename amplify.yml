version: 1
applications:
  - appRoot: /
    frontend:
      phases:
        preBuild: { commands: ["npm ci", "npx prisma generate"] }
        build: { commands: ["npm run build"] }
      artifacts: { baseDirectory: ".next", files: ["**/*"] }
      cache: { paths: ["node_modules/**/*"] }
    backend:
      phases:
        build: { commands: ["npx prisma migrate deploy"] }
    artifacts: { files: ["amplify.yml"] }
